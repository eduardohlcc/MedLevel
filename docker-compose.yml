version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medlevel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medlevel_user
      POSTGRES_PASSWORD: medlevel_password
      POSTGRES_DB: medlevel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medlevel_user -d medlevel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
